<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Decorative Glow Ring -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.3"/>
  <!-- Modern Geometric Real Estate Icon -->
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- Main Tower -->
    <path d="M150 40 L260 120 L260 270 L150 270 Z" fill="url(#primaryGrad)" fill-opacity="0.85"/>
    <!-- Second Building -->
    <path d="M40 130 L150 40 L150 270 L40 270 Z" fill="url(#primaryGrad)"/>
    <!-- Roof highlight -->
    <path d="M40 130 L150 40 L260 120" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Windows -->
    <rect x="75" y="120" width="25" height="35" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="75" y="180" width="25" height="35" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="180" y="140" width="25" height="35" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="180" y="200" width="25" height="35" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Door Accent -->
    <rect x="120" y="225" width="30" height="45" rx="6" fill="#10b981"/>
  </g>
</svg>
